version: '3.8'

services:
  keydb:
    image: eqalpha/keydb
    container_name: keydb
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my-network
    volumes:
      - keydb_data:/data

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mintflow
    ports:
      - "5432:5432"
    networks:
      - my-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    networks:
      - my-network
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    networks:
      - my-network      
    volumes:
      - qdrant_data:/qdrant/storage

  # app:
  #   build: .
  #   container_name: node-app
  #   restart: always
  #   depends_on:
  #     - keydb
  #     - postgres
  #     - weaviate
  #     - mongodb
  #   environment:
  #     DATABASE_URL: "postgres://admin:admin@postgres:5432/mydatabase"
  #     MONGO_URI: "mongodb://admin:admin@mongodb:27017"
  #     WEAVIATE_URL: "http://weaviate:8080"
  #     KEYDB_URL: "redis://keydb:6379"
  #   ports:
  #     - "3000:3600"
  #   networks:
  #     - my-network
  #   volumes:
  #     - .:/usr/src/app

networks:
  my-network:
    driver: bridge

volumes:
  keydb_data:
  postgres_data:
  mongo_data:
  qdrant_data:
